server:
  port: 8090

spring:
  application:
    name: plazoleta
  datasource:
    url: jdbc:postgresql://localhost:5432/plazoleta
    username: postgres
    password: pass
  jpa:
    hibernate:
      ddl-auto: update

security:
  jwt:
    secret: ${JWT_SECRET}
    duration: ${JWT_DURATION:15}

appDescription: "Plazoleta API"
appVersion: "1.0"